<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZeroGallery</title>
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="header-content">
                <div class="upload-token-wrapper">
                    <input type="password"
                           class="upload-token-input"
                           placeholder="Токен загрузки"
                           id="uploadToken"
                           autocomplete="off">
                </div>
            </div>
        </header>

        <button class="language-switcher" id="languageSwitcher" aria-label="Change language">🇬🇧</button>
        <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Меню">☰</button>

        <aside class="sidebar" id="sidebar">
            <div class="sidebar-content">
                <div class="section-title" data-i18n="navigation">Навигация</div>
                <div class="no-album-tile" id="noAlbumItem">
                    <span>📁</span>
                    <span data-i18n="filesWithoutAlbum">Файлы без альбома</span>
                </div>

                <div class="section-title" data-i18n="albums">Альбомы</div>
                <div class="albums-grid" id="albumsList"></div>
            </div>

            <button class="add-album-btn" id="addAlbumBtn" data-i18n="addAlbum">+ Добавить альбом</button>
        </aside>

        <main class="main-content" id="mainContent">
            <div class="main-content-inner">
                <div class="gallery-grid" id="galleryGrid"></div>
                <div class="empty-state" id="emptyState" style="display: none;">
                    <div class="empty-state-icon">📷</div>
                    <div class="empty-state-text" data-i18n="emptyState">Здесь пока ничего нет</div>
                    <div class="empty-state-hint" data-i18n="emptyStateHint">Загрузите файлы, чтобы начать</div>
                </div>
            </div>
        </main>

        <div class="upload-area-container">
            <div class="upload-area" id="uploadArea">
                <div class="upload-area-icon">📤</div>
                <p data-i18n="uploadAreaText">Перетащите файлы сюда или кликните для выбора</p>
                <input type="file" class="upload-input" id="fileInput" multiple>
            </div>
        </div>
    </div>

    <div class="modal" id="tokenModal">
        <div class="modal-content">
            <span class="modal-close" data-close="tokenModal">&times;</span>
            <h3 data-i18n="enterAccessToken">Введите токен доступа</h3>
            <div class="modal-field">
                <label class="modal-label" for="albumTokenInput" data-i18n="albumAccessToken">Токен доступа к альбому</label>
                <input type="password" id="albumTokenInput" placeholder="Введите токен" autocomplete="off">
            </div>
            <div class="modal-actions">
                <button id="submitAlbumTokenBtn" data-i18n="login">Войти</button>
            </div>
        </div>
    </div>

    <div class="modal" id="addAlbumModal">
        <div class="modal-content">
            <span class="modal-close" data-close="addAlbumModal">&times;</span>
            <h3 data-i18n="createNewAlbum">Создать новый альбом</h3>
            <div class="modal-field">
                <label class="modal-label" for="albumNameInput" data-i18n="albumName">Название альбома *</label>
                <input type="text" id="albumNameInput" placeholder="Например: Летний отпуск 2024" autocomplete="off">
            </div>
            <div class="modal-field">
                <label class="modal-label" for="albumDescriptionInput" data-i18n="description">Описание</label>
                <input type="text" id="albumDescriptionInput" placeholder="Краткое описание альбома" autocomplete="off">
            </div>
            <div class="modal-field">
                <label class="modal-label" for="albumAccessTokenInput" data-i18n="accessToken">Токен доступа</label>
                <input type="password" id="albumAccessTokenInput" placeholder="Оставьте пустым для открытого доступа" autocomplete="off">
            </div>
            <div class="modal-checkbox-field">
                <input type="checkbox" id="albumAllowRemoveDataInput" class="modal-checkbox" checked>
                <div class="modal-checkbox-wrapper">
                    <label for="albumAllowRemoveDataInput" class="modal-checkbox-label" data-i18n="allowRemoveData">Разрешить удаление данных</label>
                    <div class="modal-hint" data-i18n="allowRemoveDataHint">Если отключено, файлы в альбоме нельзя будет удалить</div>
                </div>
            </div>
            <div class="modal-actions">
                <button id="createAlbumBtn" data-i18n="create">Создать</button>
                <button class="secondary" data-close="addAlbumModal" data-i18n="cancel">Отмена</button>
            </div>
        </div>
    </div>

    <div class="modal" id="deleteConfirmModal">
        <div class="modal-content">
            <span class="modal-close" data-close="deleteConfirmModal">&times;</span>
            <h3 data-i18n="confirmDelete">Подтвердите удаление</h3>
            <p id="deleteConfirmText" style="margin-bottom: 20px; color: var(--text-secondary);"></p>
            <div class="modal-actions">
                <button class="danger" id="confirmDeleteBtn" data-i18n="delete">Удалить</button>
                <button class="secondary" data-close="deleteConfirmModal" data-i18n="cancel">Отмена</button>
            </div>
        </div>
    </div>

    <div class="modal viewer-modal" id="viewerModal">
        <button id="viewerCloseBtn" data-close="viewerModal" aria-label="Закрыть">✕</button>
        <div class="modal-content">
            <div class="viewer-content" id="viewerContent"></div>
        </div>
        <div class="zoom-info" id="zoomInfo">100%</div>
    </div>

    <template id="galleryItemTemplate">
        <div class="gallery-item">
            <img class="gallery-item-preview" alt="">
            <div class="gallery-item-info">
                <div class="gallery-item-name"></div>
                <div class="gallery-item-actions">
                    <button class="action-btn" data-action="download" title="">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                    </button>
                    <button class="action-btn" data-action="share" title="">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="18" cy="5" r="3"></circle>
                            <circle cx="6" cy="12" r="3"></circle>
                            <circle cx="18" cy="19" r="3"></circle>
                            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                        </svg>
                    </button>
                    <button class="action-btn delete-btn" data-action="delete-item" title="">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                            <line x1="10" y1="11" x2="10" y2="17"></line>
                            <line x1="14" y1="11" x2="14" y2="17"></line>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </template>

    <template id="albumTileTemplate">
        <div class="album-tile">
            <span class="lock-icon" hidden>🔒</span>
            <button class="album-delete-btn" data-action="delete-album" title="">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    <line x1="10" y1="11" x2="10" y2="17"></line>
                    <line x1="14" y1="11" x2="14" y2="17"></line>
                </svg>
            </button>
            <img class="album-tile-image" alt="">
            <div class="album-tile-info">
                <div class="album-tile-name"></div>
            </div>
        </div>
    </template>

    <script src="app.js"></script>
</body>
</html>
